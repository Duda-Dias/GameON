<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Game-Blog </title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        header { background-color: #1f1f1f; padding: 20px; text-align: center; border-bottom: 4px solid #164c05fd; }
        header a { color: #399bbc; text-decoration: none; font-size: 2.2em; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        main { max-width: 800px; margin: 30px auto; padding: 20px; background-color: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        a { color: #02a21c; text-decoration: none; }
        main img { max-width: 100%; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 2px solid #00cc00;">
        
        <!-- 1. Lado esquerdo invisível -->
        <div style="flex: 1;"></div>

        <!-- 2. Centro: O seu Título do site -->
        <div style="flex: 1; text-align: center;">
            <h1 style="margin: 0; color: #4ea8b9; letter-spacing: 2px;">GAME ON!</h1>
        </div>

        <!-- 3. Lado direito: O seu botão de Login ou Nome de Utilizador -->
        <div style="flex: 1; text-align: right; font-family: 'Segoe UI', Arial, sans-serif;">
            {% if user.is_authenticated %}
                <span style="color: #ffffff; font-size: 1.2em; font-weight: bold;">Oi, {{ user.username }}!</span>
            {% else %}
                <a href="/admin/login/" style="color: #f25050; font-size: 1.2em; font-weight: bold; text-decoration: none;">Login</a>
            {% endif %}
        </div>

    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
