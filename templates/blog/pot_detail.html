{% extends 'base.html' %}

{% block content %}
    <h2>{{ post.titulo }}</h2>
    
    <p><small>Postado em: {{ post.data_postagem|date:"d/m/Y às H:i" }}</small></p>
    
    <hr>
    
    <div>
        {{ post.conteudo|safe }}
    </div>
    
    <hr>

    <a href="{% url 'post_update' post.pk %}">Editar Post</a> | 
    <a href="{% url 'post_delete' post.pk %}">Remover Post</a> |
    <a href="{% url 'post_list' %}">Voltar para a lista</a>
{% endblock %}
